# 27B Q4_K_XL: a smaller quant (some cost in quality). The room it frees goes to a third agent:
# three agents, about 70,000 tokens each.
# Measured 2026-10-01: 31,208 MB of 32,624 used after three ~65,700-token prompts at once (about
# 1.4 GB free). The file is 3,164 MB smaller than Q5_K_XL (16,745 vs 19,909).
# While any agent is reading a long prompt, the others write at about 1 token per second.
LABEL="27B Q4_K_XL"
STATUS="tested"          # "tested" or "estimate" (rig-model reminds you to run Test B for an estimate)
SLOTS=3                  # agents at once (-np)
CTX=210000               # total context (-c); each agent holds CTX divided by SLOTS
HERMES_CONTEXT=67000     # Hermes context_length and the playbook's token number: a little below CTX / SLOTS

# No backslashes needed inside the brackets. Do not add --alias, --host, --port or --metrics here:
# ~/start-server.sh adds those for every option, so Hermes always finds qwen3.8_local.
# --min-p 0: the model card's thinking-mode setting (llama.cpp's own default is 0.05). Hermes sends no
#   sampling settings, so the server's defaults are what it gets: temperature 1.0, top_p 0.95 and
#   top_k 20 come from the model file, min_p from this flag. Added 2026-10-02.
ARGS=(
  -m ~/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
  --mmproj ~/models/vision/mmproj-F16.gguf --image-max-tokens 1024
  -ngl 99 -c $CTX -np $SLOTS --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
  --spec-type draft-mtp-adaptive,ngram-mod --spec-ngram-mod-n-match 45
  --spec-draft-n-max 9 --spec-draft-n-start 9
  --min-p 0
)
