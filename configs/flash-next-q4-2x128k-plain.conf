# Flash-Next Q4_K_M (AtomicChat AD-4.27bpw quant): two agents, 131,072 tokens each, NO drafting, no vision.
# THE EVERYDAY WORKER since 2026-10-04 (the fallback is 27b-q5xl). See the guide, "Stage 4 - the decision".
# The same as flash-next-q4-2x128k without the draft head, and with six more expert layers on the GPU
# in the VRAM the draft head used. Made 2026-10-03 because the draft-head option was down to about
# 1.7 GB of available RAM under a real Hermes run (Stage 3); this one keeps far more RAM free.
# Measured 2026-10-02 (hand-run, Stage 1e) at medium effort with the model card's sampling, text checked
# before speed, both slots holding about 129,000 tokens: 29,254 MB of 32,624 VRAM used (3.4 GB free),
# lowest available RAM 15.5 GB (process peak 48.7 GB).
# Writing: one agent 36 tok/s on a short prompt and 27 at full context; both at once 50 combined
# short and 35 combined at full context. Reading: 496-504 tok/s.
# GGML_SCHED_DEVGATHER=0 is REQUIRED: with the gather on, the first request after loading is
# right and every later one is "////////".
# Needs the r30 build and the expert cache. Do not lower -ncmoe: one more layer on the GPU would
# leave less than 1 GB of VRAM free if vision is added later.
LABEL="Flash-Next Q4_K_M"
STATUS="tested"          # "tested" or "estimate" (rig-model reminds you to run Test B for an estimate)
SLOTS=2                  # agents at once (-np)
CTX=262144               # total context (-c); each agent holds CTX divided by SLOTS
HERMES_CONTEXT=125000    # Hermes context_length and the playbook's token number: a little below CTX / SLOTS

BUILD=~/llama.cpp-rdna-r30      # this model needs the r30 build
# 4 GB of VRAM for the most-used experts; and the gather switched off (see above)
ENVS=(MOE_EXPERT_CACHE_MIB=4096 MOE_EXPERT_CACHE_DEVMAP=1 GGML_SCHED_DEVGATHER=0)

# No backslashes needed inside the brackets. Do not add --alias, --host, --port or --metrics here:
# ~/start-server.sh adds those for every option, so Hermes always finds qwen3.8_local.
# -ncmoe 41: experts of the first 41 of 48 layers stay in RAM (about 40 GiB); the rest go on the GPU.
# --lazy-mode on --load-mode none: the n-gram table (35.8 GiB) stays on disk and is read as needed.
# --cache-ram 2048: caps the server's prompt cache at 2 GB of RAM (its default is 8 GB).
# --chat-template-file: the standard Qwen3.8-Flash-Next template; this quant carries an older version.
# --min-p 0: the model card's thinking-mode setting (llama.cpp's own default is 0.05). Hermes sends no
#   sampling settings, so the server's defaults are what it gets.
ARGS=(
  -m ~/models/flash-next-atomic/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
  -ngl 99 -ncmoe 41 -c $CTX -np $SLOTS -t 6 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
  --lazy-mode on --load-mode none --cache-ram 2048
  --chat-template-file ~/models/flash-next/chat-template-standard.jinja
  --min-p 0
)
