# Flash-Next Q4_K_M (AtomicChat AD-4.27bpw quant): two agents, 65,536 tokens each, drafting on, no vision.
# Measured 2026-10-02 at medium effort with the model card's sampling, text checked before speed:
# one request alone writes 56-57 tok/s; two at once 30.6 + 25.9 = 56.5 combined; reads 482-489 tok/s.
# With both slots holding about 60,000 tokens: 30,860 MB of 32,624 VRAM used (1.8 GB free),
# lowest available RAM 16.3 GB. While one agent reads a long prompt the other writes at about 3 tok/s.
# GGML_SCHED_DEVGATHER=0 is REQUIRED: with the gather on, the first request after loading is
# right and every later one is "////////" (tested on this quant 2026-10-02).
# Needs the r30 build and the expert cache. Do not lower -ncmoe: VRAM with both slots full is the tight side.
# Hermes compresses at about half the window (about 31k) and each request starts with about 13k of
# preamble, so an agent has about 18k of working room before compression.
LABEL="Flash-Next Q4_K_M"
STATUS="tested"          # "tested" or "estimate" (rig-model reminds you to run Test B for an estimate)
SLOTS=2                  # agents at once (-np)
CTX=131072               # total context (-c); each agent holds CTX divided by SLOTS
HERMES_CONTEXT=62000     # Hermes context_length and the playbook's token number: a little below CTX / SLOTS

BUILD=~/llama.cpp-rdna-r30      # this model needs the r30 build
# 4 GB of VRAM for the most-used experts; and the gather switched off (see above)
ENVS=(MOE_EXPERT_CACHE_MIB=4096 MOE_EXPERT_CACHE_DEVMAP=1 GGML_SCHED_DEVGATHER=0)

# No backslashes needed inside the brackets. Do not add --alias, --host, --port or --metrics here:
# ~/start-server.sh adds those for every option, so Hermes always finds qwen3.8_local.
# -ncmoe 40: experts of the first 40 layers stay in RAM (about 38 GiB); the rest go on the GPU.
# --lazy-mode on --load-mode none: the n-gram table (35.8 GiB) stays on disk and is read as needed.
# --cache-ram 2048: caps the server's prompt cache at 2 GB of RAM (its default is 8 GB).
# --chat-template-file: the standard Qwen3.8-Flash-Next template; this quant carries an older version.
# --spec-draft-model ... --spec-type draft-mtp --spec-draft-n-max 3: the Unsloth shared draft head, depth 3.
#   One request alone: about 50% faster. Two at once: 8% faster (56.5 against 52.1 tok/s combined).
#   To run without it: delete those two lines and change -ncmoe 40 to -ncmoe 38 (measured: 52.1 combined,
#   reads 521-531 tok/s, 4.8 GB of VRAM free with both slots full).
# --min-p 0: the model card's thinking-mode setting (llama.cpp's own default is 0.05). Hermes sends no
#   sampling settings, so the server's defaults are what it gets.
ARGS=(
  -m ~/models/flash-next-atomic/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
  -ngl 99 -ncmoe 40 -c $CTX -np $SLOTS -t 6 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
  --lazy-mode on --load-mode none --cache-ram 2048
  --chat-template-file ~/models/flash-next/chat-template-standard.jinja
  --spec-draft-model ~/models/flash-next/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --spec-draft-ngl 99
  --spec-type draft-mtp --spec-draft-n-max 3
  --min-p 0
)
