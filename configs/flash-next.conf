# Flash-Next IQ3_XXS (ISTA GSQ-RCO quant): one agent, 131,072 tokens, no vision, no drafting.
# Reasoning effort is whatever the request asks for: Hermes sends medium; with nothing sent it is xhigh.
# Measured 2026-10-02 (hand-run, then confirmed through rig-model), text checked before speed: writes about 39 tok/s on a short
# prompt, 28.0 with a 129,654-token prompt; reads about 610-640 tok/s. At that full prompt:
# 30,903 MB of 32,624 VRAM used (1.7 GB free), lowest available RAM 28.5 GB.
# GGML_SCHED_DEVGATHER=0 is REQUIRED: with the default (gather on) this quant answers the first
# request after loading correctly and writes "////////" from the second request on.
# Needs the r30 build and the expert cache (the r20 build has no cache and writes about 17 tok/s).
# xhigh warning: one coding test at xhigh thought for 28,022 tokens, then looped and never answered
# (25 min); the same prompt at medium answered correctly in 2.2 min. So xhigh is NOT pinned here.
# ISTA say this quant was calibrated for xhigh and loses quality at medium. See the guide.
LABEL="Flash-Next IQ3_XXS"
STATUS="tested"          # "tested" or "estimate" (rig-model reminds you to run Test B for an estimate)
SLOTS=1                  # agents at once (-np)
CTX=131072               # total context (-c); each agent holds CTX divided by SLOTS
HERMES_CONTEXT=125000    # Hermes context_length and the playbook's token number: a little below CTX / SLOTS

BUILD=~/llama.cpp-rdna-r30      # this model needs the r30 build
# 4 GB of VRAM for the most-used experts; and the gather switched off (see above)
ENVS=(MOE_EXPERT_CACHE_MIB=4096 MOE_EXPERT_CACHE_DEVMAP=1 GGML_SCHED_DEVGATHER=0)

# No backslashes needed inside the brackets. Do not add --alias, --host, --port or --metrics here:
# ~/start-server.sh adds those for every option, so Hermes always finds qwen3.8_local.
# -ncmoe 35: experts of the first 35 layers stay in RAM (about 28 GiB); the rest go on the GPU.
# --lazy-mode on --load-mode none: the n-gram table (26.8 GiB) stays on disk and is read as needed;
#   everything else is loaded with plain reads. ("mmap" and "dio" load modes ran this rig out of RAM.)
# --cache-ram 2048: caps the server's prompt cache at 2 GB of RAM (its default is 8 GB).
# To force xhigh whatever the request asks for, add this line inside ARGS (tested 2026-10-02, not in use):
#   --chat-template-file ~/models/flash-next/chat-template-xhigh.jinja
# --min-p 0: the model card's thinking-mode setting (llama.cpp's own default is 0.05). Hermes sends no
#   sampling settings, so the server's defaults are what it gets: temperature 1.0, top_p 0.95 and
#   top_k 20 come from the model file, min_p from this flag. Added 2026-10-02.
ARGS=(
  -m ~/models/flash-next/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf
  -ngl 99 -ncmoe 35 -c $CTX -np $SLOTS -t 6 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
  --lazy-mode on --load-mode none --cache-ram 2048
  --min-p 0
)
